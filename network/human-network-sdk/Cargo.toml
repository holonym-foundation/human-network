[package]
name = "human-network-sdk"
version = "0.1.0"
authors = ["Nanak Nihal Khalsa <nanaknihal@gmail.com>", "Caleb Tuttle <calebtuttle@gmail.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook", "console"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
console = ["web-sys/console"]

[dependencies]
wasm-bindgen = { version = "0.2.84", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.42"
ark-ec = { workspace = true }
ark-ed-on-bn254 = "0.4.0"
ark-ff = "0.4.2"
bincode = "1.3.3"
ethers = "2.0.14"
hex.workspace = true
human-crypto = { workspace = true }
lazy_static = "1.4.0"
libp2p = { workspace = true }
async-trait = { workspace = true }
num-bigint = { version = "0.4" }
reqwest = { version = "0.12.5", features = ["json"] }
serde_json.workspace = true
serde.workspace = true

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
serde-wasm-bindgen = "0.6.5"
anyhow.workspace = true
js-sys = "0.3"
web-sys = "0.3.77"
# wasm-bindgen-test = "0.3.47"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
# Add debug symbols for better stack traces
debug = true
# Keep function names for debugging
lto = "thin"


[profile.dev]
opt-level = 1
debug = true

[profile.test]
opt-level = "s"
