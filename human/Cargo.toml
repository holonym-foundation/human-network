[workspace]
members = [
  "crates/actors",
  "crates/node",
  "crates/v0_nodes",
  "crates/messages",
  "crates/network",
  "crates/telemetry",
  "crates/rpc",
  "crates/cli",
  "crates/cryptography",
  "crates/verifier",
  "crates/registry_iface",
  "crates/env",
  "crates/rpc_trait",
  "crates/signer",
  "human-network-sdk",
  "crates/ingester",
]

resolver = "2"

[workspace.dependencies]
tokio = { version = "1.37.0", features = ["full"] }
ractor = { version = "0.12.3", features = ["async-std"] }
log = "0.4.21"
serde = { version = "1.0.198", features = ["derive"] }
thiserror = "1.0.59"
async-trait = "0.1.80"
libp2p = { version = "0.54", features = [
  "request-response",
  "cbor",
  "serde",
  "kad",
  "gossipsub",
  "tokio",
  "noise",
  "macros",
  "tcp",
  "yamux",
  "quic",
  "secp256k1",
  "relay",
  "ping",
  "identify",
] }
clap = { version = "4.5.4", features = ["derive", "cargo"] }
rand = "0.8.5"
serde_json = "1.0.116"
ractor_cluster = "0.12.3"
network = { path = "crates/network" }
messages = { path = "crates/messages" }
actors = { path = "crates/actors" }
telemetry = { path = "crates/telemetry" }
human-crypto = { path = "crates/cryptography" }
rpc_trait = { path = "crates/rpc_trait" }
rpc = { path = "crates/rpc" }
env = { path = "crates/env" }
hex = "0.4.3"
rsa = { version = "0.9.6", features = ["serde"] }
k256 = { version = "0.13.1", features = [
  "hash2curve",
  "arithmetic",
  "ecdh",
  "serde",
] }
tracing = { version = "0.1.40", features = ["log"] }
tracing-subscriber = { version = "0.3.18", features = [
  "registry",
  "env-filter",
] }
tracing-bunyan-formatter = "0.3.9"
tracing-log = "0.2"
jsonrpsee = { version = "0.24.7", features = [
  "macros",
  "client-core",
  "server-core",
  "server",
  "http-client",
] }
ethers = "2.0.14"
lru_time_cache = "0.11.11"
uuid = { version = "1.17.0", features = ["v4"] }
redis = "0.27"
num-bigint = { version = "0.4.6", features = ["serde", "rand"] }
dotenv = "0.15.0"
ark-ec = "0.4.2"
ark-ed-on-bn254 = "0.4.0"
ark-ff = "0.4.2"
bincode = "1.3.3"
lazy_static = "1.4.0"
bcrypt = "0.15.0"
blake2 = "0.10.6"
rand_core = { version = "0.6.4", features = ["getrandom"] }
getrandom = { version = "0.2.10", features = ["js"] }
wasm-bindgen = "0.2.87"
ff = { version = "0.13.0", features = ["derive"] }
num-traits = "0.2.17"
byteorder = "1.2.7"
rand_chacha = "0.3.1"
futures = "0.3.30"
itertools = "0.13"
ark-std = "0.4.0"
ark-serialize = "0.4.2"
bytemuck = "1.16.0"
hmac = "0.12.1"
sha2 = "0.10.8"
sha3 = "0.10.8"
anyhow = "1.0.82"
drand-verify = "0.6.2"
reqwest = { version = "0.12.7", features = ["json"] }
hex-literal = "0.4.1"
sled = "0.34.7"
tokio-util = "0.7.12"
delay-queue = "0.2.0"
tower = "0.4"
tower-http = "0.6"
hyper = "1.5"
alloy = { version = "0.11.0", features = ["full"] }
alloy-sol-types = "0.8.19"
pubsub-rs = "0.1.1"
rdkafka = "0.37.0"


# [[bin]]
# name = "cli"
# path = "crates/cli/src/main.rs"

[profile.release]
opt-level = 1
lto = false
debug = false
codegen-units = 16
incremental = true
