x-operator: &operator
  build:
    context: ..
    dockerfile: ./Dockerfile
  env_file: .env

x-othentic-cli: &othentic-cli
  <<: *operator
  env_file: .env
  entrypoint: othentic-cli

x-standard-config: &standard-config
  THRESHOLD_T: 4
  THRESHOLD_N: 6
  THRESHOLD_EPSILON: 1
  TESTNET_LOGGING_URL: http://10.8.0.22:3001/
  HUMAN_NODE_TEST_MODE: "true"

x-prover: &prover
  depends_on:
    - testnet-logs
  <<: *operator
  command: ["sh", "-c", "redis-server --daemonize yes; ./prover"]
  ports: 
    - "3000"

x-verifier: &verifier
  <<: *operator
  command: ["sh", "-c", "redis-server --daemonize yes; ./verifier"]

    
services:
  # For sharing all logs to the the same place for test purposes
  testnet-logs:
    <<: *operator
    command: ["sh", "-c", "redis-server --daemonize yes; ./testnet_logging"]
    ports:
      - "3001"
    networks: 
      p2p:
        ipv4_address: 10.8.0.22

  prover-1: 
    <<: *prover
    environment:
      MY_NODE_IDX: 1
      OPRFSecp256k1_KEYSHARE: ${SECP256K1_OPRF_KEYSHARE_PROVER1}
      JWTPRFSecp256k1_KEYSHARE: ${SECP256K1_JWTPRF_KEYSHARE_PROVER1}
      DecryptBabyJubJub_KEYSHARE: ${BABYJUBJUB_DECRYPT_KEYSHARE_PROVER1}
      <<: *standard-config
    networks:
      p2p:
        ipv4_address: 10.8.0.101
