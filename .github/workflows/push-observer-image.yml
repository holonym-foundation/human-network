name: Observer Continuous Deployment

on:
  push:
    paths: [
      '.github/workflows/push-observer-image.yml', 
      'observer.Dockerfile',
      'human/crates/observer/**'
    ]

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read

env:
  CONTAINER_NAME: observer
  IMAGE_NAME: holonym/observer:latest

jobs:
  docker-build-push-observer:
    name: Build and push
    runs-on: ubuntu-latest
    if: github.ref_name == 'main-current'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # token: ${{ secrets.GITHUB_TOKEN }}
          # Personal access token. For some reason, the default token doesn't work.
          # This token might expire, so if this step fails, make sure the token is up-to-date.
          # token: ${{ secrets.PERSONAL_GH_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: holonym
          password: ${{ secrets.HOLONYM_DOCKERHUB_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          file: ./observer.Dockerfile
          tags: holonym/observer:latest
          push: true
          context: .
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
