name: Publish human-network-sdk to npmjs

on:
  push:
    paths: [
      '.github/workflows/publish-human-network-sdk.yml', 
      'network/human-network-sdk/package.json'
    ]
  pull_request:
    paths:
      - '.github/workflows/publish-human-network-sdk.yml'
      - 'network/human-network-sdk/package.json'

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # token: ${{ secrets.GITHUB_TOKEN }}
          # Personal access token. For some reason, the default token doesn't work.
          # This token might expire, so if this step fails, make sure the token is up-to-date.
          # token: ${{ secrets.PERSONAL_GH_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing requires npm >= 11.5.1, which is newer than
      # the version bundled with Node 20.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: npm run build
        working-directory: ./network/human-network-sdk
      # No NODE_AUTH_TOKEN needed: npm exchanges the GitHub OIDC token
      # (id-token: write above) for a short-lived registry token. This
      # requires the package to be configured with a trusted publisher on
      # npmjs.com pointing at this repo + workflow file.
      - run: npm publish --access public
        working-directory: ./network/human-network-sdk
